<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Card</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .article-card {
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
            background: #fff;
        }
        .article-card:hover {
            transform: scale(1.02);
        }
        .article-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }
        .article-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            text-decoration: none;
        }
        .article-info {
            font-size: 0.9rem;
            color: #666;
        }
        .article-btn {
            background-color: #007bff;
            color: #fff;
            padding: 10px 15px;
            display: inline-block;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
            transition: 0.3s;
        }
        .article-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="article-card">
    <img src="{{ doc.image or 'https://via.placeholder.com/400x200' }}" alt="Article Image" class="article-image">
    <p class="article-info">By: <strong>{{ doc.author }}</strong></p>
    <p class="article-info">ISBN: {{ doc.isbn }}</p>
    <p class="article-info">Publisher: {{ doc.publisher }}</p>
    <p class="article-info">Status: <strong>{{ doc.status }}</strong></p>
    <a href="{{ doc.route }}" class="article-title">{{ doc.article_name }}</a>
    <a href="{{ doc.route }}" class="article-btn">Read More</a>
</div>

</body>
</html>
